---
default:
  max_columns: 120 
  max_rows: 40
  margin:
    percent: 8
  colors:
    foreground: "ffffff"
    background: "121212"

slide_title:
  alignment: center
  padding_bottom: 1
  padding_top: 1
  colors:
    foreground: "ffffff"
  bold: true
  font_size: 2

code:
  alignment: center
  minimum_size: 50
  minimum_margin:
    percent: 8
  theme_name: base16-eighties.dark
  padding:
    horizontal: 2
    vertical: 1

execution_output:
  colors:
    foreground: "ffffff"
    background: "404040"
  status:
    running:
      foreground: "ff6507"
    success:
      foreground: "c0c0c0"
    failure:
      foreground: "ff6507"
    not_started:
      foreground: "c44d05"

inline_code:
  colors:
    foreground: "c0c0c0"

intro_slide:
  title:
    alignment: center
    colors:
      foreground: "ff6507"
    font_size: 2
  subtitle:
    alignment: center
    colors:
      foreground: "737373"
  event:
    alignment: center
    colors:
      foreground: "c0c0c0"
  location:
    alignment: center
    colors:
      foreground: "c0c0c0"
  date:
    alignment: center
    colors:
      foreground: "c44d05"
  author:
    alignment: center
    colors:
      foreground: "ffffff"
    positioning: page_bottom
  footer: true

headings:
  h1:
    prefix: "██"
    colors:
      foreground: "ff6507"
  h2:
    prefix: "▓▓▓"
    colors:
      foreground: "c0c0c0"
  h3:
    prefix: "▒▒▒▒"
    colors:
      foreground: "ff6507"
  h4:
    prefix: "░░░░░"
    colors:
      foreground: "ff6507"
  h5:
    prefix: "░░░░░░"
    colors:
      foreground: "c0c0c0"
  h6:
    prefix: "░░░░░░░"
    colors:
      foreground: "c44d05"

block_quote:
  prefix: "▍ "
  colors:
    foreground: "ffffff"
    background: "404040"
    prefix: "c44d05"

alert:
  prefix: "▍ "
  base_colors:
    foreground: "ffffff"
    background: "404040"
  styles:
    note:
      color: "ff6507"
    tip:
      color: "c0c0c0"
    important:
      color: "c0c0c0"
    warning:
      color: "c44d05"
    caution:
      color: "ff6507"

typst:
  colors:
    foreground: "ffffff"
    background: "404040"

footer:
  style: template
  right: "{current_slide} / {total_slides}"

modals:
  selection_colors:
    foreground: "c0c0c0"

mermaid:
  background: transparent
  theme: dark
