source = ~/.config/hypr/colours.conf

$font = CaskaydiaCove Nerd Font

# GENERAL
general {
    hide_cursor = true
}

# ANIMATIONS
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, wind
    animation = fadeOut, 1, 4, wind
    animation = inputFieldDots, 1, 2, linear
}

# BACKGROUND — blurred wallpaper with dark tint
background {
    monitor =
    path = ~/.config/wallpaper/atlas/atlas.png
    blur_passes = 1
    blur_size = 4
    color = rgba(11, 11, 11, 0.4)
    noise = 0.0117
    contrast = 0.8
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# TIME — large, centred
label {
    monitor =
    text = $TIME
    color = $accent
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# DATE — below the clock
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +'%A, %d %B %Y')"
    color = $fg
    font_size = 22
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# INPUT FIELD — centred under the date
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $bgMuted
    font_color = $fg
    fade_on_empty = true
    placeholder_text = <i>Password…</i>
    hide_input = false
    rounding = 0
    check_color = $accent
    fail_color = $accent
    fail_text = $FAIL <b>$ATTEMPTS</b>
    capslock_color = $fg
    position = 0, -40
    halign = center
    valign = center
}

# BATTERY — bottom-right corner
label {
    monitor =
    text = cmd[update:60] echo "$(cat /sys/class/power_supply/BAT0/capacity)%  $(cat /sys/class/power_supply/BAT0/status | tr '[:upper:]' '[:lower:]')"
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = $font
    position = -24, 24
    halign = right
    valign = bottom
}
